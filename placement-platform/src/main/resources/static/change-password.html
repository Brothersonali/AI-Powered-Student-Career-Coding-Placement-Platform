<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | PlacementHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .change-password-section {
            max-width: 480px;
            margin: 60px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .change-password-section h2 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 10px;
        }

        .change-password-section p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .change-password-section form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .change-password-section label {
            font-weight: 600;
            color: #333;
        }

        .change-password-section input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd6e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .change-password-section input:focus {
            outline: none;
            border-color: #3182ce;
        }

        .change-password-section button {
            margin-top: 12px;
            width: 100%;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .change-password-section {
                margin: 30px 15px;
                padding: 22px;
            }
        }
    </style>
</head>
<body>

<header>
    <h2>PlacementHub</h2>
    <nav>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/student-profile.html">My Profile</a>
    </nav>
</header>

<main>
    <section class="change-password-section">
        <h2>Change Password</h2>
        <p>Update your account password securely.</p>

        <form id="changePasswordForm">

            <label for="currentPassword">Current Password</label>
            <input
                    type="password"
                    id="currentPassword"
                    required
            >

            <label for="newPassword">New Password</label>
            <input
                    type="password"
                    id="newPassword"
                    minlength="8"
                    maxlength="72"
                    required
            >

            <label for="confirmPassword">Confirm New Password</label>
            <input
                    type="password"
                    id="confirmPassword"
                    required
            >

            <button type="submit" class="btn">
                Update Password
            </button>

        </form>

        <p id="message"></p>
    </section>
</main>

<footer>
    <p>© 2026 PlacementHub | Student Career & Placement Platform</p>
</footer>

<script>
    document.getElementById("changePasswordForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const currentPassword =
                document.getElementById("currentPassword").value;

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message = document.getElementById("message");

            if (newPassword !== confirmPassword) {
                message.textContent =
                    "New password and confirm password do not match.";
                return;
            }

            if (newPassword.length < 8 || newPassword.length > 72) {
                message.textContent =
                    "Password must be between 8 and 72 characters.";
                return;
            }

            try {
                const response = await fetch("/auth/change-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        currentPassword: currentPassword,
                        newPassword: newPassword,
                        confirmPassword: confirmPassword
                    })
                });

                const result = await response.json();

                message.style.color = response.ok ? "green" : "red";

                message.textContent = result.message ||
                    (response.ok
                        ? "Password changed successfully."
                        : "Unable to change password.");

                if (response.ok) {
                    document.getElementById("changePasswordForm").reset();
                }

            } catch (error) {
                console.error("Change password error:", error);
                message.textContent =
                    "Something went wrong. Please try again.";
            }
        });
</script>

</body>
</html>
