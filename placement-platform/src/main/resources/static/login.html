<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Login | PlacementHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<header>
    <h2>PlacementHub</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#jobs">Jobs</a>
    </nav>
</header>

<main class="container">
    <section class="login-card form-card">
        <h1 class="h3 mb-3">Student Login</h1>

        <form id="loginForm">
            <label for="email">Email</label>
            <input id="email" type="email"
                   autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" type="password"
                   autocomplete="current-password" required>

            <button id="loginButton" type="submit">
                Login
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <p class="mt-3">
            New student?
            <a href="register.html">Register here</a>
        </p>

        <a href="index.html">Back to Home</a>
    </section>
</main>

<script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        button.disabled = true;
        message.textContent = "Logging in...";

        try {
            const response = await fetch("/auth/login", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "Invalid email or password");
            }

            if (!result.email) {
                throw new Error("Login response does not contain email.");
            }

            localStorage.setItem("studentEmail", result.email);
            localStorage.setItem("studentName", result.name || "");

            message.textContent = "Login successful! Opening dashboard...";

            window.location.href =
                "/dashboard.html?email=" +
                encodeURIComponent(result.email);

        } catch (error) {
            console.error("Login error:", error);
            message.textContent = error.message;
            button.disabled = false;
        }
    });
</script>

</body>
</html>
