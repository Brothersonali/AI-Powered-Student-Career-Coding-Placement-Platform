<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PlacementHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>PlacementHub</h1>
    <p>Admin Login</p>
</header>

<main class="applications-page
admin-login-page">
    <h2>Admin Login</h2>
    <p>Login to manage student applications.</p>

    <form id="adminLoginForm"
    class="admin-login-card">
        <label for="email">Admin Email</label>
        <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                required
        >

        <label for="password">Password</label>
        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
        >

        <button type="submit" class="btn" id="loginButton">
            Login as Admin
        </button>

        <p id="loginMessage" role="status"></p>
    </form>

    <p><a href="index.html">Back to Home</a></p>
</main>

<script>
    document.getElementById("adminLoginForm")
        .addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("loginMessage");
            const button = document.getElementById("loginButton");

            button.disabled = true;
            message.textContent = "Checking credentials...";

            try {
                const response = await fetch("http://localhost:8080/auth/admin/login", {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const responseText = await response.text();

                let data = {};

                try {
                    data = responseText ? JSON.parse(responseText) : {};
                } catch {
                    data = responseText;
                }

                if (!response.ok) {
                    throw new Error(
                        typeof data === "string"
                            ? data
                            : data.message || "Admin login failed."
                    );
                }

                window.location.href = "applications.html";

            } catch (error) {
                message.textContent =
                    error.message || "Unable to login. Please try again.";
                button.disabled = false;
            }
        });
</script>

</body>
</html>
